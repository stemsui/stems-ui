name: Deploy site

# Builds the static docs site + shadcn registry and deploys it to Cloudflare (stemsui.com).
# Requires repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, plus Zone > Workers
# Routes: Edit for stemsui.com) and CLOUDFLARE_ACCOUNT_ID. Without them the deploy step is skipped.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build:site

      - name: Deploy to Cloudflare
        if: env.HAS_CLOUDFLARE_SECRETS == 'true'
        working-directory: apps/docs
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Skipped deploy
        if: env.HAS_CLOUDFLARE_SECRETS != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; built the site but skipped deploy."
